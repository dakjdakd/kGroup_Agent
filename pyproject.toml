[project]
name = "guarded-lead-agent"
version = "0.1.0"
description = "Policy-governed conversational lead qualification agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "langgraph>=0.2",
]

[project.optional-dependencies]
production = ["redis>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
lead-agent = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
